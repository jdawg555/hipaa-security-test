# hipaa-audit configuration — copy to hipaa-audit.yaml in your project root
# MIT licensed — customize for your organization. Do not commit secrets.

org_name: "Your Organization Name"

policy_dir: policies
templates_dir: templates

sra_path: templates/sra-template.md
risk_register_path: templates/risk-register.md
baa_register_path: templates/baa-register.md

# External scanner evidence (run scripts/collect-external-evidence.sh)
integrations:
  max_evidence_age_days: 7
  freshness_globs:
    - evidence/latest/*.json
    - evidence/prowler/*.json
    - evidence/trivy/*.json
  prowler:
    enabled: false
    evidence_glob: evidence/prowler/*.json
  trivy:
    enabled: false
    evidence_glob: evidence/trivy/*.json
    fail_severities: [CRITICAL, HIGH]
  osv:
    enabled: false
    evidence_glob: evidence/osv/*.json
  checkov:
    enabled: false
    evidence_glob: evidence/checkov/*.json
    scan_paths:
      - examples/terraform-minimal
      - terraform
      - infra
  compliancekit:
    enabled: false
    evidence_glob: evidence/compliancekit/**/control-mapping.csv
    fail_statuses: [fail, error]
  sra_import:
    require_import: false
    evidence_globs:
      - templates/sra-imported.md
      - evidence/sra/sra-import-summary.json
  # Set true if LLMs/clinical AI touch PHI
  require_ai_register: false
  # US state codes where patients/consumers reside (triggers state-law overlay)
  applicable_states: []

aws:
  enabled: false
  region: us-east-1

github:
  enabled: false
  repo: your-org/your-repo
  default_branch: main

# Identity providers (set env: OKTA_API_TOKEN, GOOGLE_APPLICATION_CREDENTIALS)
identity:
  okta:
    enabled: false
    domain: your-org.okta.com
    token_env: OKTA_API_TOKEN
    inactive_days: 90
  google:
    enabled: false
    admin_email: admin@your-org.com
    credentials_env: GOOGLE_APPLICATION_CREDENTIALS

# Remediation tasks (auto-created on scan failures)
tasks_path: compliance/tasks.yaml
tasks:
  default_owner: security@your-org.com
  due_days: 14
