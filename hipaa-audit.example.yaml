# hipaa-audit configuration — copy to hipaa-audit.yaml in your project root
# MIT licensed — customize for your organization. Do not commit secrets.

org_name: "Your Organization Name"

# Frameworks to include in scans (HIPAA always on; SOC 2 optional)
frameworks:
  hipaa: true
  soc2: false
  iso27001: false

policy_dir: policies
templates_dir: templates

sra_path: templates/sra-template.md
risk_register_path: templates/risk-register.md
baa_register_path: templates/baa-register.md

# External scanner evidence (run scripts/collect-external-evidence.sh)
integrations:
  max_evidence_age_days: 7
  freshness_globs:
    - evidence/latest/*.json
    - evidence/prowler/*.json
    - evidence/trivy/*.json
  prowler:
    enabled: false
    evidence_glob: evidence/prowler/*.json
  trivy:
    enabled: false
    evidence_glob: evidence/trivy/*.json
    fail_severities: [CRITICAL, HIGH]
  osv:
    enabled: false
    evidence_glob: evidence/osv/*.json
  checkov:
    enabled: false
    evidence_glob: evidence/checkov/*.json
    scan_paths:
      - examples/terraform-minimal
      - terraform
      - infra
  compliancekit:
    enabled: false
    evidence_glob: evidence/compliancekit/**/control-mapping.csv
    fail_statuses: [fail, error]
  sra_import:
    require_import: false
    evidence_globs:
      - templates/sra-imported.md
      - evidence/sra/sra-import-summary.json
  # Set true if LLMs/clinical AI touch PHI
  require_ai_register: false
  # US state codes where patients/consumers reside (triggers state-law overlay)
  applicable_states: []

aws:
  enabled: false
  region: us-east-1

github:
  enabled: false
  repo: your-org/your-repo
  default_branch: main

# Identity providers (set env: OKTA_API_TOKEN, GOOGLE_APPLICATION_CREDENTIALS)
identity:
  okta:
    enabled: false
    domain: your-org.okta.com
    token_env: OKTA_API_TOKEN
    inactive_days: 90
  google:
    enabled: false
    admin_email: admin@your-org.com
    credentials_env: GOOGLE_APPLICATION_CREDENTIALS

# Remediation tasks (auto-created on scan failures)
tasks_path: compliance/tasks.yaml
tasks:
  default_owner: security@your-org.com
  due_days: 14

# Workforce compliance (Vanta personnel module)
personnel:
  enabled: false
  acknowledgments_path: compliance/acknowledgments.yaml
  training_csv: compliance/training-log.csv
  initial_training_days: 30
  annual_training_days: 365

# Vendor risk + SIG-lite questionnaire (Vanta vendor module)
vendors:
  enabled: false
  register_path: compliance/vendors.yaml
  questionnaires_path: compliance/vendor-questionnaires.yaml
  portal_dir: compliance/vendor-portals

# MDM / endpoint inventory (Jamf, Intune CSV export)
devices:
  enabled: false
  register_path: compliance/devices.yaml
  max_last_seen_days: 30

# Quarterly access review campaigns (Vanta access reviews)
access_reviews:
  enabled: false
  register_path: compliance/access-reviews.yaml
  max_campaign_age_days: 120

# SaaS app discovery (Okta) — shadow IT + vendor linkage
saas_inventory:
  enabled: false
  register_path: compliance/saas-inventory.yaml
  max_discovery_age_days: 90

# Public trust center (Vanta/Probo compliance page)
trust_center:
  output_dir: compliance/trust-center
  contact_email: security@your-org.com
  certifications_path: compliance/certifications.yaml
  request_access_note: "Request auditor evidence bundle under NDA via contact email."

# Auditor portal (read-only, optional passphrase gate)
auditor_portal:
  output_dir: compliance/auditor-portal
  access_passphrase_env: AUDITOR_PORTAL_PASSPHRASE

# Slack alerts on posture drop or failures
notifications:
  slack:
    enabled: false
    webhook_env: SLACK_WEBHOOK_URL
    min_score_drop: 5
    notify_on_fail: true
