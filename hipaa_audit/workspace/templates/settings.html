{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<p class="subtitle">Workspace configuration — saved to <code>hipaa-audit.yaml</code>. Secrets go to gitignored <code>compliance/.workspace-secrets.yaml</code>.</p>
<form method="post" action="/settings" class="form-grid" style="max-width:640px">
  <label class="full">Organization name
    <input type="text" name="org_name" value="{{ config.get('org_name', '') }}">
  </label>
  <label class="full">GitHub repo (org/name)
    <input type="text" name="github_repo" value="{{ config.get('github', {}).get('repo', '') }}">
  </label>
  <label class="full">GitLab project (group/name)
    <input type="text" name="gitlab_project" value="{{ config.get('gitlab', {}).get('project', '') }}">
  </label>
  <label class="full">Okta domain
    <input type="text" name="okta_domain" value="{{ config.get('identity', {}).get('okta', {}).get('domain', '') }}">
  </label>
  <label><input type="checkbox" name="azure_enabled" {% if config.get('identity', {}).get('azure', {}).get('enabled') %}checked{% endif %}> Azure AD app discovery (uses Intune Graph credentials)</label>
  <fieldset class="full" style="border:1px solid #e2e8f0;border-radius:8px;padding:1rem">
    <legend>AWS scanning</legend>
    <label><input type="checkbox" name="aws_multi_region" {% if config.get('aws', {}).get('multi_region') %}checked{% endif %}> Scan all AWS regions (GuardDuty, Security Hub, Config)</label><br>
    <label style="margin-top:.5rem">Explicit regions <small style="font-weight:400;color:var(--muted)">optional, space-separated</small>
      <input type="text" name="aws_regions" value="{{ (config.get('aws', {}).get('regions') or [])|join(' ') }}">
    </label>
  </fieldset>
  <fieldset class="full" style="border:1px solid #e2e8f0;border-radius:8px;padding:1rem">
    <legend>Frameworks</legend>
    <label><input type="checkbox" name="soc2" {% if config.get('frameworks', {}).get('soc2') %}checked{% endif %}> SOC 2 TSC</label><br>
    <label><input type="checkbox" name="iso27001" {% if config.get('frameworks', {}).get('iso27001') %}checked{% endif %}> ISO 27001</label><br>
    <label><input type="checkbox" name="hitrust" {% if config.get('frameworks', {}).get('hitrust') %}checked{% endif %}> HITRUST CSF</label><br>
    <label><input type="checkbox" name="pci" {% if config.get('frameworks', {}).get('pci') %}checked{% endif %}> PCI DSS (subset)</label>
  </fieldset>
  <fieldset class="full" style="border:1px solid #e2e8f0;border-radius:8px;padding:1rem">
    <legend>Multi-cloud Prowler</legend>
    <label><input type="checkbox" name="prowler_azure" {% if config.get('integrations', {}).get('prowler_azure', {}).get('enabled') %}checked{% endif %}> Prowler Azure HIPAA crosswalk</label><br>
    <label><input type="checkbox" name="prowler_gcp" {% if config.get('integrations', {}).get('prowler_gcp', {}).get('enabled') %}checked{% endif %}> Prowler GCP HIPAA crosswalk</label><br>
    <label><input type="checkbox" name="snyk_enabled" {% if config.get('integrations', {}).get('snyk', {}).get('enabled') %}checked{% endif %}> Snyk vulnerability ingest</label>
  </fieldset>
  <fieldset class="full" style="border:1px solid #e2e8f0;border-radius:8px;padding:1rem">
    <legend>Vendor AI assist (P-29)</legend>
    <label><input type="checkbox" name="ai_assist_enabled" {% if config.get('ai_assist', {}).get('enabled') %}checked{% endif %}> Enable SIG-lite draft suggestions on Vendors page</label><br>
    <label><input type="checkbox" name="ai_assist_llm" {% if config.get('ai_assist', {}).get('use_llm') %}checked{% endif %}> Use LLM when OPENAI_API_KEY is set (keyword fallback otherwise)</label>
  </fieldset>
  <label class="full">Trust center public URL <small style="font-weight:400;color:var(--muted)">for custom domain — see docs/trust-center-custom-domain.md</small>
    <input type="url" name="trust_public_url" value="{{ config.get('trust_center', {}).get('public_url', '') }}" placeholder="https://trust.your-org.com">
  </label>
  <label>Auto-scan interval (hours, 0 = manual)
    <input type="number" name="schedule_hours" value="{{ schedule_hours }}" min="0" max="168">
  </label>
  <fieldset class="full" style="border:1px solid #e2e8f0;border-radius:8px;padding:1rem">
    <legend>Slack notifications</legend>
    <label><input type="checkbox" name="slack_enabled" {% if config.get('notifications', {}).get('slack', {}).get('enabled') %}checked{% endif %}> Enable Slack alerts</label><br>
    <label><input type="checkbox" name="slack_notify_fail" {% if config.get('notifications', {}).get('slack', {}).get('notify_on_fail', True) %}checked{% endif %}> Notify on failures</label><br>
    <label><input type="checkbox" name="slack_notify_task_assign" {% if config.get('notifications', {}).get('slack', {}).get('notify_on_task_assign') %}checked{% endif %}> Notify on task assignment</label><br>
    <label style="margin-top:.5rem">Min score drop to alert
      <input type="number" name="slack_min_drop" value="{{ config.get('notifications', {}).get('slack', {}).get('min_score_drop', 5) }}" min="1" max="50" step="0.5">
    </label>
    <label style="margin-top:.5rem">Webhook URL <small style="font-weight:400;color:var(--muted)">saved to secrets file</small>
      <input type="password" name="slack_webhook" placeholder="https://hooks.slack.com/..." autocomplete="off">
    </label>
  </fieldset>
  <div class="full"><button class="btn" type="submit">Save settings</button></div>
</form>
{% endblock %}
