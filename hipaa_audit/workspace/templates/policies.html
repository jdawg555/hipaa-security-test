{% extends "base.html" %}
{% block content %}
<h1>Policies</h1>
<p class="subtitle">HIPAA-aligned policy library — edit in the browser or in <code>policies/</code>.</p>
<ul style="line-height:2.2;list-style:none;padding:0">
  {% for p in policies %}
  <li>
    <a href="/policies/edit/{{ p }}">{{ p }}</a>
  </li>
  {% else %}
  <li>Run onboarding or <code>hipaa-audit init</code> to copy policy templates.</li>
  {% endfor %}
</ul>
{% endblock %}
