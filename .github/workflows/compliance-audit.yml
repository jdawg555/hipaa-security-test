name: HIPAA Compliance Audit

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  pull_request:
    paths:
      - "policies/**"
      - "templates/**"
      - "compliance/**"
      - "hipaa-audit.yaml"
      - ".github/workflows/compliance-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # for AWS OIDC if enabled

jobs:
  hipaa-audit:
    name: hipaa-audit scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hipaa-audit + scanners
        run: |
          pip install -e ".[aws,github]"
          pip install checkov
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1

      - name: Collect OSS scanner evidence
        run: |
          mkdir -p evidence/trivy evidence/osv evidence/checkov
          trivy fs --format json --output evidence/trivy/report.json --skip-dirs .venv . || true
          /home/runner/go/bin/osv-scanner --format json --output evidence/osv/report.json -r . || true
          checkov -d examples/terraform-minimal --config-file examples/terraform-minimal/.checkov.yaml \
            --framework terraform -o json --output-file-path evidence/checkov || true

      - name: Run compliance scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          src = Path("hipaa-audit.example.yaml")
          cfg = yaml.safe_load(src.read_text())
          cfg["org_name"] = "CI Audit"
          cfg.setdefault("github", {})["enabled"] = True
          integrations = cfg.setdefault("integrations", {})
          integrations.setdefault("trivy", {})["enabled"] = True
          integrations.setdefault("osv", {})["enabled"] = True
          integrations.setdefault("checkov", {})["enabled"] = True
          Path("hipaa-audit.yaml").write_text(yaml.dump(cfg))
          PY
          hipaa-audit scan . -o evidence/ci-${{ github.run_id }}

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: hipaa-audit-evidence
          path: evidence/ci-${{ github.run_id }}/
          retention-days: 90

      - name: Fail on critical control failures
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("evidence/ci-${{ github.run_id }}/audit-report.json"))
          fails = [c for c in data["controls"] if c["status"] in ("fail", "error")]
          if fails:
              print(f"::error::{len(fails)} HIPAA control(s) failed")
              for c in fails[:10]:
                  print(f"  FAIL {c['id']}: {c['checks'][0]['message']}")
              sys.exit(1)
          print(f"All automated checks passed ({data['summary']})")
          PY
