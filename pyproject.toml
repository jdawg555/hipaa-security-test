[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hipaa-audit"
version = "1.8.0"
description = "Free, open-source HIPAA Security Rule compliance auditor — Vanta/Drata-style controls without the subscription."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "hipaa-audit contributors" }]
keywords = ["hipaa", "compliance", "security", "healthcare", "grc", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
github = ["PyGithub>=2.3"]
identity = ["google-api-python-client>=2.100", "google-auth>=2.29"]
all = ["hipaa-audit[aws,github,identity]"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
hipaa-audit = "hipaa_audit.cli:app"

[project.urls]
Homepage = "https://github.com/jdawg555/hipaa-security-test"
Documentation = "https://github.com/jdawg555/hipaa-security-test/blob/main/docs/getting-started.md"
Issues = "https://github.com/jdawg555/hipaa-security-test/issues"

[tool.hatch.build.targets.wheel]
packages = ["hipaa_audit"]

[tool.hatch.build.targets.wheel.force-include]
"controls" = "controls"
"controls/probo-hipaa-catalog.json" = "controls/probo-hipaa-catalog.json"
"policies" = "policies"
"templates" = "templates"
"integrations" = "integrations"
"hipaa-audit.example.yaml" = "hipaa-audit.example.yaml"
"compliance" = "compliance"
"scripts" = "scripts"

[tool.ruff]
line-length = 100
target-version = "py311"
